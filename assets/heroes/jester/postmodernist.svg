<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Laugh Track — postmodern comedy night hero</title>
  <desc id="desc">A Memphis-inspired comedy night poster in teal, coral, yellow, and purple with the headline Serious plans are canceled.</desc>
  <rect width="1200" height="650" fill="#f8e8ca"/>
  <rect y="0" width="1200" height="88" fill="#252f52"/>
  <text x="62" y="58" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#f8e8ca">LAUGH TRACK!!!</text>
  <text x="1138" y="57" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#f8e8ca">IMPROV WITHOUT A NET</text>
  <path d="M74 137l40-26 44 30-20 46-51-3z" fill="#ed594a" stroke="#252f52" stroke-width="4"/>
  <circle cx="224" cy="157" r="26" fill="#3fae9e" stroke="#252f52" stroke-width="4"/>
