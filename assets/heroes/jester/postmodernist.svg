  <text x="91" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="67" font-weight="700" fill="#252f52" transform="rotate(-2 91 270)">Serious plans</text>
  <text x="106" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="69" font-weight="700" font-style="italic" fill="#e34e54" transform="rotate(1 106 344)">are canceled.</text>
  <text x="107" y="396" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#252f52">Come watch our best ideas go gloriously wrong.</text>
