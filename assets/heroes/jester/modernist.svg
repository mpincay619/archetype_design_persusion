<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Laugh Track — modernist comedy night hero</title>
  <desc id="desc">A crisp cream, black, and red grid with a geometric laughing face and the headline Your Tuesday called. It needs a better story.</desc>
  <rect width="1200" height="650" fill="#f5f0e6"/>
  <rect x="42" y="38" width="1116" height="574" fill="none" stroke="#191919" stroke-width="2"/>
  <text x="78" y="92" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="4" fill="#191919">LAUGH TRACK</text>
  <text x="1120" y="91" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#4d4a45">LIVE IMPROV · EVERY THURSDAY</text>
  <line x1="78" y1="116" x2="1120" y2="116" stroke="#aaa49a" stroke-width="1"/>
  <rect x="78" y="154" width="10" height="10" fill="#e64d37"/>
  <text x="102" y="164" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#e64d37">ONE NIGHT. NO SCRIPT.</text>
  <text x="78" y="241" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#191919">Your Tuesday called.</text>
  <text x="78" y="303" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#191919">It needs a better</text>
  <text x="78" y="365" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-2" fill="#e64d37">story.</text>
  <text x="80" y="412" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4d4a45">Unscripted comedy, made up on the spot</text>
  <text x="80" y="437" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#4d4a45">with whatever the room throws at us.</text>
  <rect x="78" y="474" width="190" height="56" fill="#191919"/>
  <text x="173" y="509" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#fff">GET TICKETS →</text>
  <text x="78" y="570" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#77716a">THU 8 PM · THE LITTLE ROOM</text>
