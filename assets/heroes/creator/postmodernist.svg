<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Creator archetype Vaporwave hero design</title>
  <desc id="desc">A vaporwave-inspired postmodern hero with neon gradients, retro-futurist type, and a synthwave palette to emphasize originality and creative experimentation.</desc>
  <defs>
    <linearGradient id="bgGradient" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#120b2b"/>
      <stop offset="32%" stop-color="#2a1548"/>
      <stop offset="68%" stop-color="#5a2b78"/>
      <stop offset="100%" stop-color="#f7a8d8"/>
    </linearGradient>
    <linearGradient id="sunGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffe977"/>
      <stop offset="50%" stop-color="#ff9ecb"/>
      <stop offset="100%" stop-color="#ff5ca8"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#67f7ff"/>
      <stop offset="100%" stop-color="#7b6cff"/>
    </linearGradient>
    <linearGradient id="panelGradient" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#fef6ff"/>
      <stop offset="100%" stop-color="#ffd1eb"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#8ef7ff" flood-opacity="0.76"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  <rect x="0" y="480" width="1200" height="340" fill="#140d2a" opacity="0.75"/>
  <rect x="0" y="500" width="1200" height="300" fill="url(#grid)" opacity="0.9"/>

  <circle cx="910" cy="170" r="150" fill="url(#sunGradient)" opacity="0.78"/>
  <circle cx="910" cy="170" r="95" fill="#ffe7f3" opacity="0.38"/>
  <path d="M 115 540 C 300 470, 445 455, 610 470 S 945 555, 1090 520 L 1090 800 L 115 800 Z" fill="#25145d" opacity="0.78"/>
  <path d="M 0 630 C 210 570, 320 545, 460 560 S 770 640, 1200 610 L 1200 800 L 0 800 Z" fill="#1b1037" opacity="0.9"/>

  <g opacity="0.9">
    <rect x="95" y="92" width="170" height="42" rx="6" fill="#0b0619"/>
    <text x="118" y="120" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" letter-spacing="0.22em" fill="#f9f0ff">MAKE / PLAY</text>
  </g>

  <g transform="rotate(-15 330 300)">
    <rect x="190" y="155" width="260" height="220" fill="#67f7ff" opacity="0.92"/>
    <path d="M 210 320 L 295 175 L 420 190 L 352 350 Z" fill="#f7b0d9" opacity="0.9"/>
  </g>

  <g transform="rotate(12 695 250)">
    <rect x="560" y="138" width="190" height="170" fill="#ff7ac4" opacity="0.9"/>
    <rect x="690" y="250" width="160" height="65" fill="#ffe977" opacity="0.82"/>
  </g>

  <g transform="rotate(-10 930 400)">
    <rect x="826" y="250" width="220" height="200" fill="#7b6cff" opacity="0.92"/>
    <circle cx="900" cy="330" r="55" fill="#f7d36a" opacity="0.9"/>
  </g>

  <g transform="rotate(18 1000 610)">
    <rect x="860" y="540" width="210" height="135" fill="#ff6ca4"/>
  </g>

  <g transform="rotate(-20 300 620)">
    <rect x="200" y="535" width="180" height="180" fill="#ffd56c" opacity="0.9"/>
  </g>

  <g filter="url(#softGlow)">
    <text x="105" y="350" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="140" letter-spacing="-0.08em" fill="#f8e6ff">MAKE</text>
    <text x="105" y="485" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="138" letter-spacing="-0.08em" fill="#67f7ff">IT</text>
    <text x="105" y="620" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="132" letter-spacing="-0.08em" fill="#f8e6ff">YOUR</text>
    <text x="105" y="720" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="120" letter-spacing="-0.08em" fill="#ffa5d8">WAY</text>
  </g>

  <g>
    <rect x="485" y="610" width="230" height="74" rx="8" fill="url(#cyanGlow)"/>
    <text x="522" y="658" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="18" letter-spacing="0.18em" fill="#120b2b">START THE PROJECT</text>
  </g>

  <g>
    <rect x="735" y="600" width="335" height="130" rx="10" fill="url(#panelGradient)" opacity="0.94"/>
    <text x="770" y="655" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="0.06em" fill="#1d1734">DESIGN</text>
    <text x="770" y="700" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" letter-spacing="0.06em" fill="#1d1734">WITHOUT LIMITS</text>
  </g>

  <circle cx="1030" cy="250" r="18" fill="#67f7ff"/>
  <circle cx="1060" cy="280" r="11" fill="#ffd56c"/>
  <circle cx="330" cy="655" r="20" fill="#ff7ac4"/>
  <circle cx="410" cy="615" r="12" fill="#67f7ff"/>
  <rect x="485" y="230" width="110" height="86" transform="rotate(18 540 273)" fill="#28185d" opacity="0.9"/>
  <rect x="595" y="293" width="100" height="128" transform="rotate(-8 645 357)" fill="#ff8cc6" opacity="0.8"/>
</svg>
