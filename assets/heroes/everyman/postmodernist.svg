<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Common Cup — postmodern neighborhood coffee hero</title>
  <desc id="desc">A colorful Memphis-inspired composition with a coffee cup and the headline Your usual, with a little extra good.</desc>
  <rect width="1200" height="650" fill="#f7e9d2"/>
  <rect y="0" width="1200" height="88" fill="#283c55"/>
  <text x="62" y="58" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="4" fill="#f7e9d2">COMMON CUP!</text>
  <text x="1138" y="57" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#f7e9d2">COME AS YOU ARE</text>
  <path d="M75 145l38-26 47 27-17 47-51-2z" fill="#e86b5b" stroke="#283c55" stroke-width="4"/>
