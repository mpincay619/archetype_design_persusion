  <text x="110" y="480" fill="#202a2a" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">for your next step.</text>
  <text x="112" y="555" fill="#465452" font-family="Arial, Helvetica, sans-serif" font-size="24">A clear starting point for the people</text>
  <text x="112" y="590" fill="#465452" font-family="Arial, Helvetica, sans-serif" font-size="24">who count on you.</text>
