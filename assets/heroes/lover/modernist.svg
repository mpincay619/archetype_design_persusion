<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Serein — modernist perfume hero</title>
  <desc id="desc">A restrained cream, rose, and charcoal layout with a perfume bottle and the headline Make room for closeness.</desc>
  <rect width="1200" height="650" fill="#f5f1e9"/>
  <rect x="44" y="42" width="1112" height="566" fill="none" stroke="#20201e" stroke-width="2"/>
  <text x="82" y="93" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="5" fill="#292723">SEREIN</text>
  <text x="1117" y="92" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="2" fill="#6e6962">SCENT, CLOSE TO YOU</text>
  <line x1="82" y1="119" x2="1117" y2="119" stroke="#aaa39a"/>
  <text x="82" y="195" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="3" fill="#9a5362">ROSE / CEDAR / SKIN</text>
  <text x="82" y="278" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#20201e">Make room</text>
  <text x="82" y="345" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-2" fill="#20201e">for closeness.</text>
  <text x="84" y="399" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d5852">A soft, skin-close fragrance for the moments</text>
  <text x="84" y="426" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#5d5852">you want to keep near.</text>
  <rect x="82" y="463" width="220" height="54" rx="2" fill="#873d50"/>
  <text x="192" y="497" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="1" fill="#fffaf5">FIND YOUR SCENT  →</text>
  <text x="82" y="565" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#77716a">SMALL BATCH · 50 ML</text>
  <line x1="654" y1="151" x2="654" y2="562" stroke="#d4cdc3"/>
  <circle cx="884" cy="343" r="184" fill="#ead4d1"/>
  <circle cx="1017" cy="203" r="24" fill="#c18388"/>
  <path d="M742 499 C814 464 938 464 1030 499" fill="none" stroke="#b78172" stroke-width="2"/>
  <rect x="824" y="259" width="132" height="218" rx="15" fill="#f8e9e4" stroke="#7e4750" stroke-width="3"/>
  <path d="M843 260v-27h94v27" fill="#b56673" stroke="#7e4750" stroke-width="3"/>
  <rect x="858" y="208" width="64" height="25" rx="4" fill="#34312f"/>
  <rect x="832" y="327" width="116" height="103" fill="#d88f98" opacity=".78"/>
  <text x="890" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="3" fill="#542e39">SEREIN</text>
  <text x="890" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2" fill="#542e39">ROSE + CEDAR</text>
  <text x="890" y="411" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" letter-spacing="1" fill="#542e39">EAU DE PARFUM</text>
  <text x="1094" y="571" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="2" fill="#77716a">01 / 02</text>
