<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">PLAIN CANVAS — Ruler archetype modernist hero</title>
  <desc id="desc">A Swiss-inspired two-column website hero. The left column presents a free t-shirt care guide. An original vector portrait of an adult in a white t-shirt looks inward from the right.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8e8df"/>
      <stop offset="1" stop-color="#d7ddd3"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffefa"/>
      <stop offset="0.58" stop-color="#f3f2ec"/>
      <stop offset="1" stop-color="#dcded8"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98762"/>
      <stop offset="1" stop-color="#a85e43"/>
    </linearGradient>
    <pattern id="fine-grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#4d5d4b" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1536" height="1024" fill="#f5f2e9"/>
  <rect x="768" width="768" height="1024" fill="url(#panel)"/>
  <rect x="768" width="768" height="1024" fill="url(#fine-grid)"/>

  <g fill="none" stroke="#35483b" stroke-opacity=".14">
    <path d="M824 72V952M1480 72V952" stroke-width="1"/>
    <path d="M824 128H1480M824 896H1480" stroke-width="1"/>
    <path d="M872 128V896M1432 128V896" stroke-width="1"/>
  </g>
  <path d="M868 896V386a284 284 0 0 1 568 0v510Z" fill="#e4e4da"/>
  <path d="M906 896V392a246 246 0 0 1 492 0v504Z" fill="#dce1d7"/>
  <path d="M928 896V448M1376 896V448" stroke="#c3cabe" stroke-width="2"/>
  <path d="M880 896H1424" stroke="#b9c1b7" stroke-width="2"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="88" y="92" fill="#193b2b" font-size="27" font-weight="700" letter-spacing="3.5">PLAIN CANVAS</text>
    <path d="M88 118H260" stroke="#193b2b" stroke-width="2"/>
    <text x="88" y="157" fill="#536257" font-size="12" font-weight="700" letter-spacing="2.3">PREMIUM ORGANIC COTTON</text>

    <text x="88" y="291" fill="#244432" font-size="14" font-weight="700" letter-spacing="2.4">THE RULER  /  BUILT ON PRINCIPLE</text>
    <text x="84" y="400" fill="#17221b" font-size="70" font-weight="700" letter-spacing="-3">Everyday,</text>
    <text x="84" y="484" fill="#17221b" font-size="70" font-weight="700" letter-spacing="-3">held to a</text>
    <text x="84" y="568" fill="#17221b" font-size="70" font-weight="700" letter-spacing="-3">higher standard.</text>

    <path d="M88 650H160" stroke="#244432" stroke-width="5"/>
    <text x="88" y="704" fill="#49544b" font-size="22">A premium heavyweight organic cotton tee,</text>
    <text x="88" y="739" fill="#49544b" font-size="22">made for a considered everyday. Get our free</text>
    <text x="88" y="774" fill="#49544b" font-size="22">guide to making your essentials last.</text>

    <rect x="88" y="818" width="374" height="72" rx="3" fill="#193b2b"/>
    <text x="275" y="864" fill="#fffefa" font-size="18" font-weight="700" text-anchor="middle" letter-spacing=".2">Get the free care guide</text>
    <text x="88" y="922" fill="#5b635c" font-size="15">PDF download. No email required.</text>

    <text x="824" y="966" fill="#415247" font-size="12" font-weight="700" letter-spacing="1.8">01  /  THE EVERYDAY TEE</text>
    <text x="1480" y="966" fill="#415247" font-size="12" text-anchor="end" letter-spacing="1.5">HEAVYWEIGHT  ·  ORGANIC COTTON</text>
  </g>

  <ellipse cx="1187" cy="923" rx="250" ry="34" fill="#657065" opacity=".2" filter="url(#soft-shadow)"/>

